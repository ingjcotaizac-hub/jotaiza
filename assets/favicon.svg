<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo blanco neutro con borde técnico de alta precisión -->
  <rect width="64" height="64" fill="#FFFFFF"/>
  <rect x="1" y="1" width="62" height="62" fill="none" stroke="#0F1115" stroke-width="2"/>
  
  <!-- Marca tipográfica 'J' con rigor geométrico y técnico -->
  <path d="M38 16 V40 C38 46.5 33.5 50 26 50 C20 50 16 47 14 43" fill="none" stroke="#0F1115" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
  
  <!-- Señal gráfica en Azul Ultramar intenso -->
  <rect x="42" y="16" width="6" height="6" fill="#0038FF"/>
  
  <!-- Retícula técnica sutil -->
  <line x1="24" y1="16" x2="38" y2="16" stroke="#0F1115" stroke-width="5" stroke-linecap="square"/>
</svg>
