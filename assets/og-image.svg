<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .og-bg { fill: #FFFFFF; }
      .og-border { stroke: #0F1115; stroke-width: 2; fill: none; }
      .og-hairline { stroke: #D8DCE3; stroke-width: 1; fill: none; }
      .og-mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; fill: #5E6573; letter-spacing: 0.16em; }
      .og-brand { font-family: 'IBM Plex Sans', sans-serif; font-size: 42px; font-weight: 700; fill: #0F1115; letter-spacing: 0.08em; }
      .og-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 52px; font-weight: 700; fill: #0F1115; line-height: 1.15; }
      .og-title-accent { fill: #0038FF; }
      .og-subtitle { font-family: 'IBM Plex Sans', sans-serif; font-size: 23px; font-weight: 400; fill: #2A2D34; line-height: 1.45; }
      .og-signal { fill: #0038FF; }
    </style>
  </defs>

  <!-- Fondo blanco neutro -->
  <rect width="1200" height="630" class="og-bg"/>
  
  <!-- Marco estructural exterior de alta definición -->
  <rect x="40" y="40" width="1120" height="550" class="og-border"/>
  
  <!-- Retícula técnica editorial interior -->
  <line x1="40" y1="130" x2="1160" y2="130" class="og-hairline"/>
  <line x1="40" y1="490" x2="1160" y2="490" class="og-hairline"/>
  <line x1="860" y1="40" x2="860" y2="490" class="og-hairline"/>

  <!-- Cabecera -->
  <text x="70" y="94" class="og-brand">JOTAIZA</text>
  <rect x="250" y="72" width="10" height="10" class="og-signal"/>
  <text x="275" y="90" class="og-mono">ESTUDIO TÉCNICO // E-LEARNING &amp; MOODLE</text>

  <!-- Panel de coordenadas (arriba a la derecha) -->
  <text x="880" y="80" class="og-mono">REF: SYS-2026-ID</text>
  <text x="880" y="104" class="og-mono">LOC: BARCELONA (ES)</text>

  <!-- Titular Hero Editorial de gran impacto -->
  <text x="70" y="225" class="og-title">Tu campus Moodle, bien gestionado.</text>
  <text x="70" y="295" class="og-title">Tus manuales, convertidos en cursos.</text>

  <!-- Subtítulo técnico descriptivo -->
  <text x="70" y="375" class="og-subtitle">Administración funcional de Moodle y transformación de contenidos formativos</text>
  <text x="70" y="415" class="og-subtitle">para academias, centros de formación y empresas.</text>

  <!-- Columna lateral técnica (derecha) -->
  <rect x="880" y="170" width="240" height="85" fill="#F6F7F9" stroke="#D8DCE3" stroke-width="1"/>
  <text x="900" y="200" class="og-mono" fill="#0038FF">01 // LÍNEA OPERATIVA</text>
  <text x="900" y="228" font-family="'IBM Plex Sans', sans-serif" font-size="14px" font-weight="600" fill="#0F1115">Gestión funcional Moodle</text>

  <rect x="880" y="280" width="240" height="85" fill="#F6F7F9" stroke="#D8DCE3" stroke-width="1"/>
  <text x="900" y="310" class="og-mono" fill="#0038FF">02 // PRODUCCIÓN</text>
  <text x="900" y="338" font-family="'IBM Plex Sans', sans-serif" font-size="14px" font-weight="600" fill="#0F1115">Manuales a e-learning</text>

  <!-- Pie técnico -->
  <text x="70" y="535" class="og-mono">ESPECIALISTA INDEPENDIENTE · JUAN CARLOS OTAIZA · JOTAIZA.COM</text>
  <text x="960" y="535" class="og-mono" fill="#0038FF">ESTUDIO DE PRODUCCIÓN</text>
</svg>
